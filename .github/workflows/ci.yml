name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissões mínimas: apenas leitura do conteúdo. Sem deploy, sem secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Habilitar Corepack (pnpm)
        run: corepack enable

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências (reproduzível)
        run: pnpm install --frozen-lockfile

      # Gates de segurança de dependências (ver docs/08-seguranca-e-privacidade.md):
      # bloqueia moderadas+ em produção e altas/críticas em qualquer dependência.
      - name: Auditoria de dependências de produção (>= moderate)
        run: pnpm audit --prod --audit-level=moderate

      - name: Auditoria de todas as dependências (>= high)
        run: pnpm audit --audit-level=high

      - name: Gerar Prisma Client
        run: pnpm prisma:generate

      - name: Validar schema do Prisma
        run: pnpm prisma:validate
        env:
          # Valor fictício apenas para resolver env() do datasource na validação.
          # NÃO é um segredo e não conecta a nenhum banco real.
          DATABASE_URL: 'postgresql://user:pass@localhost:5432/annalu?schema=public'

      - name: Lint
        run: pnpm lint

      - name: Verificação de tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Verificar links da documentação
        run: pnpm docs:check-links
