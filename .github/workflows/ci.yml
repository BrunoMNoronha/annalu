name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissões mínimas: apenas leitura do conteúdo. Sem deploy, sem secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    # PostgreSQL DESCARTÁVEL, apenas baseline de CI (não é decisão do provedor de
    # produção — ver docs/14). Credenciais fictícias e explícitas; banco termina
    # em "_test". Não usar GitHub Secrets para credenciais descartáveis.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: annalu_test
          POSTGRES_PASSWORD: annalu_test
          POSTGRES_DB: annalu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Ambas apontam SOMENTE para o banco descartável do job.
      DATABASE_URL: 'postgresql://annalu_test:annalu_test@localhost:5432/annalu_test?schema=public'
      TEST_DATABASE_URL: 'postgresql://annalu_test:annalu_test@localhost:5432/annalu_test?schema=public'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Habilitar Corepack (pnpm)
        run: corepack enable

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências (reproduzível)
        run: pnpm install --frozen-lockfile

      # Gates de segurança de dependências (ver docs/08-seguranca-e-privacidade.md).
      - name: Auditoria de dependências de produção (>= moderate)
        run: pnpm audit --prod --audit-level=moderate

      - name: Auditoria de todas as dependências (>= high)
        run: pnpm audit --audit-level=high

      - name: Gerar Prisma Client
        run: pnpm prisma:generate

      - name: Validar schema do Prisma
        run: pnpm prisma:validate

      - name: Aplicar migration no PostgreSQL de teste
        run: pnpm prisma:migrate:deploy

      - name: Seed fictício (1ª execução)
        run: pnpm prisma:seed

      - name: Seed fictício novamente (idempotência)
        run: pnpm prisma:seed

      - name: Testes de integração (PostgreSQL)
        run: pnpm test:integration

      - name: Verificação de formatação (Prettier)
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Verificação de tipos
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Smoke test de produção (otimização de imagem / sharp)
        run: pnpm smoke:production

      - name: Verificar links da documentação
        run: pnpm docs:check-links
