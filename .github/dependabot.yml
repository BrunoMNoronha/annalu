version: 2

# Atualizações automáticas de dependências (apenas ABERTURA de PRs).
# Sem auto-merge, sem credenciais, sem acesso a serviços externos.
updates:
  # Ecossistema npm (pnpm usa o mesmo manifesto/lockfile).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    # Comportamento (ver docs/08-seguranca-e-privacidade.md):
    # - patch/minor são AGRUPADOS em um único PR;
    # - major NÃO entra no grupo, logo abre em PR SEPARADO;
    # - nenhuma atualização é mesclada automaticamente (sem auto-merge);
    # - major exige revisão humana (notas de migração, breaking changes).
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - 'patch'
          - 'minor'

  # Ações do GitHub usadas no workflow de CI.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    labels:
      - 'ci'
